# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 20:10 UTC
    - cron: 10 20 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --bump-synced --tap="$TAP_NAME"

  linkage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Install formulae from bottles
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew tap-info --json "$TAP_NAME" | jq -r '.[0].formula_names[]' | tee formulae.txt | xargs brew install --force-bottle

      - name: Check bottles against current Homebrew/core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_DEVELOPER: 1
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Bottles broken by Homebrew/core changes
        shell: bash -euo pipefail {0} # no -x, which would put the trace in the issue
        run: |
          issue="$(gh issue list --search "\"$TITLE\" in:title" --limit 1 --json number --jq '.[].number')"
          if ! (xargs brew linkage --test < formulae.txt && xargs brew test < formulae.txt) 2>&1 | tee result.txt; then
            echo "Found by $RUN_URL" >> result.txt
            [[ -n "$issue" ]] || gh issue create --title "$TITLE" --body-file result.txt
            exit 1
          fi
          [[ -z "$issue" ]] || gh issue close "$issue" --comment "Fixed as of $RUN_URL"
