# brew tap-new uses this file to generate an autobump workflow for the new tap
name: brew bump

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    # Every day at 20:10 UTC
    - cron: 10 20 * * *

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Bump formulae
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew bump --no-fork --open-pr --bump-synced --tap="$TAP_NAME"

  # Homebrew/core rebuilds its own dependents when a dependency's compatibility_version goes up, but
  # not this tap's, so do the same here with a revision bump PR
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Set up git
        uses: Homebrew/actions/git-user-config@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1

      - name: Bump revisions of formulae with stale bottles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          BRANCH: rebuild-stale-bottles
        run: |
          cd "$(brew --repo "$TAP_NAME")"
          if [[ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --json number --jq '.[]')" ]]; then
            exit 0
          fi
          stale="$(python3 .github/stale-bottles.py "$TAP_NAME")"
          if [[ -z "$stale" ]]; then
            exit 0
          fi
          git checkout -b "$BRANCH"
          while IFS=$'\t' read -r formula deps; do
            brew bump-revision --message "for ${deps// /, }" "$formula"
          done <<< "$stale"
          gh auth setup-git
          git push --force "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Rebuild bottles for core compatibility changes" \
            --body "A dependency's \`compatibility_version\` went up since these bottles were built:"$'\n\n'"${stale//$'\t'/: }"
