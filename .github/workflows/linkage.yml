name: brew linkage

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/linkage.yml
  schedule:
    - cron: 10 21 * * *
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  linkage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up Homebrew
        id: brew
        uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d # 2026.11.14.1

      - name: Check bottles
        env:
          TAP: ${{ steps.brew.outputs.tap-name }}
        run: |
          mapfile -t formulae < <(brew tap-info --json "$TAP" | jq -r '.[0].formula_names[]')
          brew install --force-bottle "${formulae[@]}"
          brew linkage --test "${formulae[@]}"
          brew test "${formulae[@]}"
